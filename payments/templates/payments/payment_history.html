<h2>Payment History</h2>

<p><b>Sale ID:</b> {{ sale.id }}</p>
<p><b>Total Sale Amount:</b> ₹{{ sale.total_amount }}</p>
<p><b>Total Paid:</b> ₹{{ total_paid }}</p>
<p><b>Balance:</b> ₹{{ balance }}</p>

<hr>

<table border="1">

<tr>
<th>ID</th>
<th>Amount</th>
<th>Date</th>
</tr>

{% for p in payments %}

<tr>

<td>{{ p.id }}</td>
<td>₹{{ p.amount }}</td>
<td>{{ p.paid_at|date:"d-m-Y H:i" }}</td>

</tr>

{% empty %}

<tr>
<td colspan="3">No payments yet</td>
</tr>

{% endfor %}

</table>
