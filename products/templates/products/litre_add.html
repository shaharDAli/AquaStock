<!DOCTYPE html>
<html>
<head>
    <title>Add Litre</title>
</head>
<body>

<h2>Add Litre</h2>

<form method="POST">
    {% csrf_token %}

    <label>Litre Name</label>
    <br>
    <input type="text" name="name" required>
    <br><br>

    <label>Price</label>
    <br>
    <input type="number" step="0.01" name="price" required>
    <br><br>

    <button type="submit">Save</button>

</form>

<br>

<a href="{% url 'litre_list' %}">Back</a>

</body>
</html>
