<!DOCTYPE html>
<html>
<head>
    <title>Edit Litre</title>
</head>
<body>

<h2>Edit Litre</h2>

<form method="POST">
    {% csrf_token %}

    <label>Litre Name</label>
    <br>
    <input type="text" name="name" value="{{ litre.name }}" required>
    <br><br>

    <label>Price</label>
    <br>
    <input type="number" step="0.01" name="price" value="{{ litre.current_price }}" required>
    <br><br>

    <button type="submit">Update</button>

</form>

<br>

<a href="{% url 'litre_list' %}">Back</a>

</body>
</html>
